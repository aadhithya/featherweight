name: release

# Only the release pull request is a manual step, because main is protected and you choose when a release is made.
#
#   1. Run this workflow by hand (Actions, release, Run workflow). It opens or updates one release pull request: the next
#      version, worked out from the commit messages, and the new section of CHANGELOG.md. Nothing is tagged or released.
#   2. Review that pull request, and merge it when its checks are green. Merging it is your decision to release.
#   3. The merge makes the tag and the GitHub release (the notes are the changelog section) by itself, and the `publish` job
#      then builds the package and publishes it to PyPI (trusted publishing: no token is stored). The `docs` job then
#      publishes the documentation site for the release (docs.yml). See docs/releasing.md.
#
# Any other push to main does nothing here. See docs/releasing.md. The secret RELEASE_TOKEN lets the release pull request
# start the `test` check (a pull request made with the default token does not).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # By hand: open or update the release pull request. Nothing is tagged or released here.
  release-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # On a push to main: if the push is a merged release pull request, make the tag and the GitHub release. For any other push
  # it does nothing, and it never opens a pull request.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # After the tag and the release are made, and only then: build the package, check it, and publish it to PyPI. It has no
  # trigger of its own, so a push that is not a merged release pull request never reaches it. Trusted publishing (OpenID
  # Connect) means that no PyPI token is stored in the repository: the project on pypi.org names this workflow and the
  # `pypi` environment as the one allowed to publish.
  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # to attach the built files to the GitHub release
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}

  # After the package is published, and only then: publish the documentation site for this release (a version of
  # https://ftw.asankar.de, see docs.yml). Its failure does not undo the release: run the `docs` workflow by hand.
  docs:
    needs: [release, publish]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write # docs.yml pushes the gh-pages branch
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}

name: release

# Releases are manual, in two steps, because main is protected. Run this workflow by hand (Actions, release, Run workflow):
#
#   1. step "prepare": opens or updates one release pull request: the next version, worked out from the commit messages,
#      and the new section of CHANGELOG.md. Nothing is tagged or released.
#   2. Review the pull request, and merge it when its checks are green.
#   3. step "publish": makes the tag and the GitHub release, whose notes are the changelog section, from the merged
#      release pull request.
#
# Nothing runs on its own: there is no trigger but the button. See docs/releasing.md. The secret RELEASE_TOKEN lets the
# release pull request start the `test` check (a pull request made with the default token does not).

on:
  workflow_dispatch:
    inputs:
      step:
        description: "prepare: open the release pull request. publish: tag and release a merged release pull request."
        type: choice
        required: true
        options:
          - prepare
          - publish

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Step 1: open or update the release pull request. Nothing is tagged or released here.
  prepare:
    if: inputs.step == 'prepare'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Step 3: make the tag and the GitHub release of the merged release pull request. It never opens a pull request.
  publish:
    if: inputs.step == 'publish'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

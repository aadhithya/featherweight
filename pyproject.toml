[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
featherweight = ["py.typed"]  # the package is typed

[project]
name = "featherweight"
version = "0.1.0"
description = "An opinionated agent harness where Pydantic is the specification: typed agents, sub-agents and skills, with retries, failures as values, and a trace of every attempt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Aadhithya" }, { name = "Claude", email = "noreply@anthropic.com" }]
keywords = ["agents", "llm", "pydantic", "langchain", "langgraph", "mcp", "streaming", "ag-ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "ag-ui-protocol>=1.0",
    "aiosqlite",
    "jsonschema",
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "pydantic>=2",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/aadhithya/featherweight"
Documentation = "https://github.com/aadhithya/featherweight/blob/main/docs/README.md"
Repository = "https://github.com/aadhithya/featherweight"
Issues = "https://github.com/aadhithya/featherweight/issues"
Changelog = "https://github.com/aadhithya/featherweight/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
    "langchain-mcp-adapters>=0.3.2",
]
anthropic = [
    "langchain-anthropic>=1.7",
]
openai = [
    "langchain-openai>=1.8",
]
postgres = [
    "psycopg[binary]>=3.2",
]
otel = [
    "opentelemetry-api>=1.30",
]
all = [
    "featherweight[mcp,anthropic,openai,postgres,otel]",
]

[dependency-groups]
dev = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.2",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.5",
    "ty>=0.0.105",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "examples/doclearn"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: real Gemini calls on the small fixtures and the examples; run with `make e2e`, excluded from `make test`"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length: the formatter owns code; long strings (prompts, docstrings) are fine
    "UP046",  # keep `Generic[T]` on the pydantic generic models rather than PEP 695 syntax
    "UP047",
]

[tool.ty.environment]
extra-paths = ["src", "tests", "examples/doclearn", "examples/chat"]

# `ty` is strict on the harness (src/) and the small examples. The tests and the doclearn example read `result.output`
# after checking `result.status`, which `ty` cannot narrow (they are separate fields), and doclearn's agents override
# `check_output` with their own input and output types. Those rules are relaxed there, and only there.
[[tool.ty.overrides]]
include = ["tests/**", "examples/doclearn/**"]

[tool.ty.overrides.rules]
missing-union-attribute = "ignore"
missing-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-explicit-return = "ignore"
unsupported-operator = "ignore"
incompatible-attribute-override = "ignore"
invalid-assignment = "ignore"

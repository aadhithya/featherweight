[project]
name = "micro"
version = "0.1.0"
description = "An opinionated agent harness where Pydantic is the specification: typed agents, sub-agents and skills, with retries, failures as values, and a trace of every attempt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "fakeredis",
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "examples/doclearn", "examples/doclearn/tests"]
testpaths = ["tests", "examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: real Gemini calls on the small fixtures and the examples; run with `make e2e`, excluded from `make test`"]
addopts = "-m 'not e2e'"

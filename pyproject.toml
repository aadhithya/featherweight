[project]
name = "micro"
version = "0.1.0"
description = "An opinionated agent harness where Pydantic is the specification: typed agents, sub-agents and skills, with retries, failures as values, and a trace of every attempt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "fakeredis",
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "examples/doclearn", "examples/doclearn/tests"]
testpaths = ["tests", "examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: real Gemini calls on the small fixtures and the examples; run with `make e2e`, excluded from `make test`"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["examples/doclearn/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length: the formatter owns code; long strings (prompts, docstrings) are fine
    "UP046",  # keep `Generic[T]` on the pydantic generic models rather than PEP 695 syntax
    "UP047",
]

[tool.ty.environment]
extra-paths = ["src", "tests", "examples/doclearn", "examples/doclearn/tests"]

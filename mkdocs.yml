# The documentation site: https://ftw.asankar.de. Made from docs/ (the pages stay readable on GitHub) and from the
# docstrings of src/featherweight. `make docs` serves it, `make docs-build` builds it (strict: a broken link fails).
# The release workflow publishes it, one version per minor release, with mike (see docs/releasing.md).
site_name: featherweight
site_description: An opinionated Python agent harness. An agent is a typed class, a runner runs it with retries and limits, and jobs run in your process or on workers.
site_url: https://ftw.asankar.de/
repo_url: https://github.com/aadhithya/featherweight
repo_name: aadhithya/featherweight
edit_uri: edit/main/docs/
copyright: Designed by a human. Implemented by AI agents.

docs_dir: docs
exclude_docs: |
  book/code/
  book/SUMMARY.md
  book/STYLE.md

theme:
  name: material
  font: false # no Google Fonts: nothing is fetched from a third party. assets/site.css sets the system fonts
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    # Dark is the default for everyone (no `media` rule, so the OS setting is not followed); the toggle switches to light.
    # The colours are in assets/site.css.
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode

extra_css:
  - assets/site.css

extra:
  generator: false
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid # the diagrams (production-stack.md, the map): Material draws them in the browser
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  - scripts/docs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: list
            filters: ["!^_"]

# The book and the API reference are filled in by scripts/docs_hooks.py: the book from docs/book/SUMMARY.md, the reference
# from the modules of the package. The guides and the specs are listed here.

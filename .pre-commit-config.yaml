# Install once, for the commit checks and the commit message check:
#   uv run pre-commit install
# Run on every file:
#   uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Commit messages follow Conventional Commits: `type(scope): subject`, e.g. `feat(runner): launch agents`.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

  # Lint and format with ruff, from the version in uv.lock (the same one CI uses).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, markdown]

  # Type check with ty, over the whole project (a change in one file can break another).
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false

  # The navigation of the book (docs/book) and its code listings must match its table of contents. Fast, no Docker.
  - repo: local
    hooks:
      - id: book-navigation
        name: book navigation
        entry: python3 scripts/build_book.py --check
        language: system
        files: ^(docs/book/|scripts/build_book\.py$)
        pass_filenames: false

  # All the tests with coverage, in the Docker container (`make coverage`). They never call a real model: the e2e tests are
  # excluded and the container gets blank API keys and tokens. It fails under 95% overall or 90% in a suite, and when the
  # badges or the test map were out of date (it writes them: add them and commit again). The `test` check of a pull request
  # runs the same (.github/workflows/test.yml). The recipes, the book and the skill are tested too, so a change to a page
  # runs them.
  # Needs Docker running and the image built (`make build`; rebuild after a dependency change).
  - repo: local
    hooks:
      - id: coverage
        name: tests and coverage (docker)
        entry: make coverage
        language: system
        files: ^(src|tests|examples|docs|skills|scripts|\.github|\.claude-plugin)/|^(conftest\.py|pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml|mkdocs\.yml|release-please-config\.json|\.release-please-manifest\.json|README\.md|AGENTS\.md|CONTRIBUTING\.md)$
        pass_filenames: false

  # The documentation site (mkdocs.yml) must build, strict: a broken link, a missing page or a bad docstring fails the commit.
  # In the Docker container, as your user, like `make docs-build`. Needs Docker running and the image built (`make build`).
  - repo: local
    hooks:
      - id: docs-site
        name: docs site (docker)
        entry: make docs-build
        language: system
        files: ^(docs/|src/featherweight/|scripts/docs_hooks\.py$|scripts/build_book\.py$|mkdocs\.yml$)
        pass_filenames: false

# Install once, for the commit checks and the commit message check:
#   uv run pre-commit install
# Run on every file:
#   uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Commit messages follow Conventional Commits: `type(scope): subject`, e.g. `feat(runner): launch agents`.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]

  # Lint and format with ruff, from the version in uv.lock (the same one CI uses).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, markdown]

  # Type check with ty, over the whole project (a change in one file can break another).
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false

  # The navigation of the book (docs/book) and its code listings must match its table of contents. Fast, no Docker.
  - repo: local
    hooks:
      - id: book-navigation
        name: book navigation
        entry: python3 scripts/build_book.py --check
        language: system
        files: ^(docs/book/|scripts/build_book\.py$)
        pass_filenames: false

  # Unit tests, in the Docker container. They never call a real model: the e2e tests are excluded and the container gets
  # blank API keys, so an accidental call fails at once and costs nothing. They run here and not in CI, which only
  # lints and type checks. Needs Docker running and the image built (`make build`; rebuild after a dependency change).
  # Skipped when a commit changes only docs.
  - repo: local
    hooks:
      - id: pytest
        name: unit tests (docker)
        entry: docker compose run --rm -e GOOGLE_API_KEY= -e ANTHROPIC_API_KEY= -e OPENAI_API_KEY= featherweight pytest -q -m "not e2e"
        language: system
        files: ^(src|tests|examples)/|^pyproject\.toml$|^uv\.lock$
        pass_filenames: false

  # The documentation site (mkdocs.yml) must build, strict: a broken link, a missing page or a bad docstring fails the commit.
  # In the Docker container, as your user, like `make docs-build`. Needs Docker running and the image built (`make build`).
  - repo: local
    hooks:
      - id: docs-site
        name: docs site (docker)
        entry: make docs-build
        language: system
        files: ^(docs/|src/featherweight/|scripts/docs_hooks\.py$|scripts/build_book\.py$|mkdocs\.yml$)
        pass_filenames: false
